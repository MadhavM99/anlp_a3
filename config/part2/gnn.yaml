dataset: gossipcop
data_root: data/part2
seeds: [0, 1, 2, 3, 4]
epochs: 100
batch_size: 128
lr: 0.005
weight_decay: 0.01
hidden: 128
dropout: 0.5
average: macro
standardize: true
gat_heads: 8
gat_dropout: 0.6
bigcn_edge_drop: 0.2
architecture:
  feature: bert
  models: [mlp, gcn, sage, gat, bigcn]
ablation:
  model: sage
  features: [profile, spacy, bert, content]
template: results/part2/results_template.json
output_dir: output/part2
results_dir: results/part2
checkpoint_dir: models/part2
